<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="סלון ענאן — חנות מוצרי חשמל. האתר בשלבי הקמה, והקטלוג הראשוני הוא נתוני פיתוח."
    />
    <title>סלון ענאן | מוצרי חשמל</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('anan-locale');
        var locale = raw && JSON.parse(raw).state.locale;
        if (locale === 'he' || locale === 'ar') {
          document.documentElement.lang = locale;
        }
      } catch (error) {
        /* keep the default Hebrew document */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
